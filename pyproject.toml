[project]
name = "building-with-the-claude-api"
version = "2.0.0"
description = "Modern Python companion to Anthropic's 'Building with the Claude API' Academy course, updated for the 2026 Claude platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.4.0",
    "python-dotenv>=1.2.0",
]

[project.optional-dependencies]
# Lessons 32-38 (Retrieval Augmented Generation).
rag = [
    "voyageai>=0.5.0",
    "numpy>=2.1.0",
]
# Lessons 47-56 (Model Context Protocol) on the current SDK generation, v2.
mcp = [
    "mcp[cli]>=2.2.0,<3",
]

[project.scripts]
lesson = "course.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared/python/course"]

[tool.pytest.ini_options]
testpaths = ["tests/python", "shared/python"]
pythonpath = ["shared/python"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
